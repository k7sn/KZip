[package]
name = "kzip"
version = "0.1.0"
description = "KZip Dual-Pane File & Archive Manager"
authors = ["KZip Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/k7sn/KZip"
edition = "2021"

[lib]
name = "kzip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.8.6"
ignore = "0.4.23"
regex = "1.11.1"
chrono = { version = "0.4.39", features = ["serde"] }
once_cell = "1.20.2"
parking_lot = "0.12.3"
thiserror = "2.0.9"
widestring = "1.1.0"
sysinfo = "0.33.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging"
] }
winapi = { version = "0.3.9", features = [
    "winuser",
    "windef",
    "minwindef",
    "fileapi",
    "handleapi",
    "errhandlingapi",
    "objbase",
    "guiddef",
    "propidl"
] }
